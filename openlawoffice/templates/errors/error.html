{% extends "base.html" %}

{% block title %}{{ code }} &middot; {{ app_name }}{% endblock %}

{% block content %}
<section class="error-panel">
  <p class="error-code">{{ code }}</p>
  <h1>{{ heading }}</h1>
  <p class="lede">{{ message }}</p>
  <p class="error-actions">
    <a class="button button-primary" href="{{ url_for('main.index') }}">Return home</a>
  </p>
</section>
{% endblock %}
