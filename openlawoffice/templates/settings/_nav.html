<nav class="settings-nav" aria-label="Settings">
  <a class="settings-tab{% if request.endpoint == 'settings.firm' %} is-active{% endif %}"
     href="{{ url_for('settings.firm') }}">Firm Profile</a>
  <a class="settings-tab{% if request.endpoint == 'settings.matter_types' %} is-active{% endif %}"
     href="{{ url_for('settings.matter_types') }}">Matter Types</a>
  <a class="settings-tab{% if request.endpoint and request.endpoint.startswith('users.') %} is-active{% endif %}"
     href="{{ url_for('users.index') }}">Users</a>
</nav>
